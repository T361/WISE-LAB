[build]
  command = "npm run build"
  publish = "dist"

# ── Redirects for Old URLs ────────────────────────────────────────────────────
# Forwards users and search engine crawlers from old URLs to their new destinations:

[[redirects]]
  from = "/founder-flightpath"
  to = "/incubation"
  status = 301
  force = true

[[redirects]]
  from = "/enterprise-flightpath"
  to = "/micro-entrepreneurship"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/happenings"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/happenings"
  status = 301
  force = true

# ── SPA fallback (must remain last) ───────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
