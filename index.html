    <script type="application/ld+json">

        "@context": "https://schema.org",

        "url": "https://wiselab.org.pk/",

        "slogan": "Her idea. Her enterprise.",

          "name": "Pakistan"
        }
      }
    </script>
    <!-- WebSite schema: tells Google the canonical home URL and enables Sitelinks -->

    </script>
    <!-- SiteNavigationElement: explicitly lists real nav sections so Google
         replaces stale /blog sitelinks with the actual navigation structure. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "WISE Lab Site Navigation",
        "itemListElement": [

            "target": {

              "urlTemplate": "https://wiselab.org.pk/"

      }
    </script>
